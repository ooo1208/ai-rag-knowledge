spring:
  application:
    name: ai-rag-knowledge
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

app:
  # 系统预置模型配置：首次启动时用于写入数据库模型目录，也作为默认客户端配置。
  chat:
    ollama:
      model: deepseek-r1:1.5b
    openai-compatible:
      model: gpt-4o-mini

  # 数据库中的动态模型 Provider 地址必须命中对应的 host/端口白名单。
  # Ollama 默认允许当前开发环境的内网地址；生产环境请按实际 egress 覆盖。
  model-provider:
    outbound:
      ollama:
        allowed-hosts: ${OLLAMA_ALLOWED_HOSTS:192.168.23.100}
        allowed-ports: ${OLLAMA_ALLOWED_PORTS:11434}
        allow-private: ${OLLAMA_ALLOW_PRIVATE:true}
      openai-compatible:
        allowed-hosts: ${OPENAI_COMPATIBLE_ALLOWED_HOSTS:api.openai.com}
        allowed-ports: ${OPENAI_COMPATIBLE_ALLOWED_PORTS:443}
        allow-private: ${OPENAI_COMPATIBLE_ALLOW_PRIVATE:false}

  # 受控联网搜索默认关闭。启用后只使用服务端登记的 Tavily-compatible provider，
  # 请求方不能传入 endpoint、API Key 或任意抓取 URL。
  network-search:
    enabled: ${WEB_SEARCH_ENABLED:false}
    endpoint: ${WEB_SEARCH_ENDPOINT:https://api.tavily.com/search}
    credential-ref: ${WEB_SEARCH_CREDENTIAL_REF:config:app.network-search.api-key}
    api-key: ${TAVILY_API_KEY:}
    timeout-ms: ${WEB_SEARCH_TIMEOUT_MS:5000}
    max-results: ${WEB_SEARCH_MAX_RESULTS:10}
    max-response-bytes: ${WEB_SEARCH_MAX_RESPONSE_BYTES:524288}
    cache-ttl-ms: ${WEB_SEARCH_CACHE_TTL_MS:30000}
    cache-max-entries: ${WEB_SEARCH_CACHE_MAX_ENTRIES:128}

  # MCP 工具执行默认关闭。开启前必须先登记启用的 SSE 服务器、工具白名单和凭证。
  # 第一版只允许只读且无需确认的工具，输出会标记为不可信内容。
  mcp:
    execution:
      enabled: ${MCP_EXECUTION_ENABLED:false}
      timeout-ms: ${MCP_EXECUTION_TIMEOUT_MS:10000}
      max-request-bytes: ${MCP_EXECUTION_MAX_REQUEST_BYTES:131072}
      # 开启执行时必须配置精确域名或 *.example.com 形式的子域白名单。
      allowed-hosts: ${MCP_EXECUTION_ALLOWED_HOSTS:}
