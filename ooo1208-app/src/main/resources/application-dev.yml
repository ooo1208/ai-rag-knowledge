server:
  port: 8090

spring:
  datasource:
    # 连接信息支持环境变量覆盖，避免把真实凭证写入仓库。
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    url: ${POSTGRES_URL:jdbc:postgresql://192.168.23.100:15432/ai-rag-knowledge}
    type: com.zaxxer.hikari.HikariDataSource
    # hikari连接池配置
    hikari:
      #连接池名
      pool-name: HikariCP
      #最小空闲连接数
      minimum-idle: 5
      # 空闲连接存活最大时间，默认10分钟
      idle-timeout: 600000
      # 连接池最大连接数，默认是10
      maximum-pool-size: 10
      # 此属性控制从池返回的连接的默认自动提交行为,默认值：true
      auto-commit: true
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
      max-lifetime: 1800000
      # 数据库连接超时时间,默认30秒
      connection-timeout: 30000
      # 连接测试query
      connection-test-query: SELECT 1
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      embedding:
        model: text-embedding-ada-002
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://192.168.23.100:11434}
      embedding:
        options:
          num-batch: 512
        model: nomic-embed-text
    rag:
      embed: nomic-embed-text

# Redis
redis:
  sdk:
    config:
      host: ${REDIS_HOST:192.168.23.100}
      port: ${REDIS_PORT:16379}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

github:
  token:

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
